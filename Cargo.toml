[package]
name = "rust-regime"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.19"
avian3d = "0.7"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
fastnoise-lite = "1"

# Fast dev builds: optimize dependencies, keep our own code quick to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
