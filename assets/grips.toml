# Where each weapon model's hands go, in the weapon's glTF space (-Z down the barrel, +Y up, the
# trigger at the origin): the right fist's centre, and the support hand's with the bone it rides
# (like the shotgun's pump) for weapons held in two hands. Read by the game (src/character.rs) and by
# the finger solver (tools/character/grips.py), which writes each character's finger poses.
# The support hand's fist closes around `cradle` (the middle of the handguard, or its lowest 4 cm
# where it is too deep to grip), around `vertical` on a vertical foregrip, and around `angled` just
# behind an angled one, its heel against the grip's back.

[rifle]
right = [0.0, -0.038, 0.030]
left = [0.0, 0.03, -0.20]
cradle = [0.0, 0.044, -0.2]
vertical = [0.0, -0.0421, -0.346]
angled = [0.0, 0.044, -0.286]

[shotgun]
right = [0.0, -0.085, 0.068]
left = [0.0, 0.0, -0.30]
left_bone = "pump"
cradle = [0.0, 0.0, -0.3]
vertical = [0.0, -0.0696, -0.325]
angled = [0.0, 0.0063, -0.265]

