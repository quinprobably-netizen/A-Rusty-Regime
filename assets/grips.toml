# Where each weapon's holds are, in the weapon's glTF space (-Z down the barrel, +Y up, the trigger
# at the origin): `right` is the middle of the pistol grip, `cradle` the middle of the handguard (or
# the pump, with `left_bone` the bone it rides), `vertical` and `angled` the foregrips when fitted.
# tools/character/grips.py fits each hold's cylinder round its point in the weapon mesh and solves
# every character's palm frames and finger poses (assets/models/character/<id>.grips.toml); the game
# (src/character.rs) reads only `right`, `left` and `left_bone`, to hang a weapon with no solved pose
# and to know which bone the support hand rides.
[rifle]
right = [0.0, -0.038, 0.030]
left = [0.0, 0.03, -0.20]
cradle = [0.0, 0.044, -0.2]
vertical = [0.0, -0.0421, -0.346]
angled = [0.0, 0.044, -0.286]

[shotgun]
right = [0.0, -0.085, 0.068]
left = [0.0, 0.0, -0.30]
left_bone = "pump"
cradle = [0.0, 0.0, -0.3]
vertical = [0.0, -0.0696, -0.325]
angled = [0.0, 0.0063, -0.265]

[pistol]
right = [0.0, -0.05, 0.055]

[smg]
right = [0.0, -0.05, 0.045]
left = [0.0, 0.03, -0.15]
cradle = [0.0, 0.022, -0.15]
vertical = [0.0, -0.0551, -0.203]
angled = [0.0, 0.022, -0.15]

[dmr]
