# The faction ships: handling, collision boxes, seat, exit and camera for each `models/ships/<id>.glb`
# (built by tools/ships). Frame: +X right, +Y up, -Z nose; metres, kilograms, m/s and m/s².
# `rest` is the distance from the ship's centre down to the bottom of its landing gear and must
# match the lowest collider face. `rates` are pitch, yaw and roll at full stick, rad/s. `engine_r`
# sizes the exhaust glow discs. The first ship is the player's and stands nearest the spawn.

[[ship]]
id = "kestrel"
name = "Kestrel"
faction = "deserters"
mass = 6000
thrust = 30
lift = 20
rates = [1.6, 1.1, 2.2]
cruise = 160
boost_max = 6000
rest = 1.45
seat = [0.0, 0.4, -2.0]
exit = [-6.5, -0.4, 0.0]
cam = [20, 5]
engine_r = 0.6
collider = [
    { center = [0.0, 0.0, 0.0], size = [2.4, 1.6, 10.0] },
    { center = [0.0, -0.2, 1.0], size = [11.0, 0.3, 3.5] },
    { center = [0.0, -1.3, 0.5], size = [3.2, 0.3, 6.0] },
]

