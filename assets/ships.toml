# The faction ships: handling, collision boxes, seat, exit and camera for each `models/ships/<id>.glb`
# (built by tools/ships). Frame: +X right, +Y up, -Z nose; metres, kilograms, m/s and m/s².
# `rest` is the distance from the ship's centre down to the bottom of its landing gear and must
# match the lowest collider face. `rates` are pitch, yaw and roll at full stick, rad/s. `engine_r`
# sizes the exhaust glow discs. Hulls are hollow: the boxes are floor, ceiling, walls, bulkheads
# and the open ramp (`rot` in degrees), and the player walks the space between them. `exit` is
# the cabin floor spot the pilot stands up on; it is also where you respawn. `cabin` is the floor
# and ceiling height, `ramp` the hinge, `ramp_len` and `ramp_slope` the open ramp (the game swings
# it shut in flight). `response` is how quickly the ship answers the stick, 1/s (heavy hulls
# swing round slowly), and `drag` scales air drag (a boxy hull is slowed more). The first ship is
# the player's and stands nearest the spawn; the first four stand on the apron.
#
# `kind = "fighter"` is a small solid hull with no inside (the default, `"cabin"`, is all of the
# above): no seat, exit, cabin or ramp, one box round the whole hull, and the player cannot board
# it. Its `exhaust.<n>` and `heat` nodes glow like any ship's.
#
# Combat (`src/solar/combat.rs`, numbers in tuning.toml `[ship_combat]`): `shield` and `hull` are
# points (default 60 and 100; the shield takes damage first and comes back), `faction` is whose
# ship it is (default "deserters", the player's side: shots never hurt their own side) and `guns`
# are the nose guns' muzzles in the ship's frame, fired in turn (none, no guns).
#
# `ai` is how the hull fights when an enemy pilot flies it (`src/solar/ai.rs`), through the same
# stick and flight model as yours: inside `attack_range` (m, default 1200) it aims where its shots
# will meet you and fires while that is within `cone` degrees of its nose (3); it closes to `hold`
# metres and keeps there (0, the default, rushes straight in); nearer than `break_range` (150) it
# breaks off for about `break_time` seconds (2.5) at `break_turn` of full stick (1: a hard turn;
# less is a wide one) and opens out to three times that range before it turns back in; at
# `flee_hull` of its hull it runs for good (0, never); further than `boost_range` (1500) it
# boosts; its aim wanders up to `wobble` degrees across the lead (1).

