# The roster: characters, factions, which factions each team fields, and classes. Edit and press F5
# in game.
#
# Every character has its own model, models/character/<id>.glb. Colours tint its cloth: primary
# (main cloth), secondary (second cloth), accent (straps, trim). `loadout` is the weapon bots
# wearing the character carry (rifle shotgun pistol smg dmr revolver grenade harpoon rocket fist).

[character.acolyte]
name = "Acolyte"
faction = "regime"
primary = "#1a1a1d"
secondary = "#2a2a2e"
accent = "#7a1010"
loadout = "rifle"

[character.zealot]
name = "Zealot"
faction = "regime"
primary = "#1c1a1e"
secondary = "#3a3036"
accent = "#8a1414"
loadout = "revolver"

