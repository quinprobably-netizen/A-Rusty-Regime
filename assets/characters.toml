[faction.regime]
name = "Regime"
characters = ["acolyte", "zealot", "choir"]

[faction.scrappers]
name = "Scrappers"
characters = ["mechanic", "bruiser", "trapper"]

[faction.deserters]
name = "Deserters"
characters = ["runner", "breaker", "ghost"]

[faction.pmc]
name = "PMC"
characters = ["contractor", "juggernaut", "handler"]

# Factions each soldier team draws from. Team 0 fights on the player's side.
[teams]
"0" = ["deserters"]
"1" = ["regime", "scrappers", "pmc"]

[class.pilot]
character = "runner"
ability = "grapple"
health = 100.0
sprint_mult = 1.0

[class.grunt]
character = "acolyte"
ability = "none"
health = 100.0
sprint_mult = 0.9
