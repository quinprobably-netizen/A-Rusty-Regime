# Rust Regime tuning. Edit and press F5 in game to reload.
# Distances in meters; 1 TF2 Hammer unit = 0.022 m. Delete a line to use its default.

# Core Source movement
gravity = 9.8               # Earth; see the round-home-world spec
max_speed = 7.5             # ground run speed
crouch_speed_mult = 0.33
accelerate = 10.0           # sv_accelerate
air_accelerate = 10.0       # sv_airaccelerate (TF2 = 10)
air_speed_cap = 0.66        # the 30u cap that makes air strafing work
friction = 4.0
stop_speed = 2.2
jump_speed = 4.74           # 1.15 m jump
jump_buffer = 0.08          # seconds a jump press is remembered before landing
auto_bhop = false           # true = hold jump to bunny hop
bhop_speed_cap = 0.0        # 0 = off. TF2 uses 1.2
ramp_launch_speed = 4.0     # upward speed above which you can't be grounded (ramp slides)
walkable_normal_y = 0.7     # slopes steeper than ~45.6 degrees are surfable
step_height = 0.4
terminal_velocity = 77.0

# Hull
radius = 0.4
stand_height = 1.8
crouch_height = 1.36
eye_from_top = 0.2

# Slide
slide_min_speed = 6.0
slide_boost = 2.5
slide_boost_cooldown = 1.0
slide_friction = 0.6
slide_end_speed = 3.0
slide_steer = 1.5

# Wall run / wall jump
wallrun_min_speed = 5.0
wallrun_speed = 9.0
wallrun_max_time = 1.6
wallrun_gravity_scale = 0.25
wall_jump_out = 6.0
wall_jump_up = 4.85         # 1.2 m wall jump
wall_reach = 0.3

# Air jump (double jump): extra jumps after leaving the ground, reset on ground, wall, mantle, grapple
air_jumps = 1
air_jump_speed = 4.74       # 1.15 m jump
air_jump_redirect = 0.6     # 0 keeps momentum, 1 fully redirects horizontal speed to the wish direction

# Mantle (ledge heights measured from your feet)
mantle_min_height = 0.45
mantle_max_height = 1.5
mantle_time = 0.3

# Rocket launcher (weapon 1)
rocket_speed = 24.0
rocket_cooldown = 0.8
rocket_mag = 4               # rockets in the tube, TF2 style
rocket_reload = 1.4
blast_radius = 3.2
self_knockback = 9.7        # 4.8 m rocket jump
prop_knockback = 14.0
prop_ref_mass = 40.0
push_strength = 0.6


# Look and controller
mouse_sensitivity = 0.002
stick_yaw_speed = 4.5       # radians per second at full tilt
stick_pitch_speed = 3.0
stick_deadzone = 0.15
stick_look_curve = 2.0      # higher = finer aim near the center of the stick
invert_y = false
fov_degrees = 75
third_person = false        # play from behind the right shoulder (T toggles in game)
third_person_distance = 2.6 # metres behind the eyes, about half that while aiming
third_person_shoulder = 0.55
ads_fov = 0.7               # field of view multiplier aiming down sights (right mouse)
ads_fov_scoped = 0.85       # the same through a magnifying scope (the scope's picture does the zooming)
ads_time = 0.15             # seconds to settle into the aimed view
wallrun_tilt_degrees = 12.0
rumble = true

# Hitscan guns. pellets = rays per shot, spread in degrees, prop_impulse is the
# speed a hit adds to a prop of prop_ref_mass, kick is viewmodel recoil.
[rifle]                     # weapon 2, hold to fire
damage = 18.0
cooldown = 0.09
pellets = 1
spread_degrees = 0.6
range = 200.0
prop_impulse = 3.0
automatic = true
kick = 0.5
velocity = 850              # m/s; bullets drop and slow (drag per metre)
drag = 0.0006
recoil_up = 0.35            # degrees of view kick per shot
recoil_side = 0.18
heat_spread = 2.5           # spread multiplier at full heat
ads_spread = 0.4            # spread multiplier aiming down sights (right mouse)
mag = 30                    # rounds per magazine (R reloads, an empty gun reloads itself)
reload = 2.0                # seconds
scope_mag = 3  # magnification of the fitted scope (fixed); 0 = no scope part

[shotgun]                   # weapon 3: Breacher pump, 20-round drum
mag = 20
reload = 2.6
scope_mag = 3
damage = 9.0
cooldown = 0.75
pellets = 10
spread_degrees = 5.0
range = 40.0
prop_impulse = 2.5
automatic = false
kick = 2.0

[pistol]                    # weapon 4: Smite
mag = 9
reload = 1.5
scope_mag = 0
damage = 25.0
cooldown = 0.17
pellets = 1
spread_degrees = 0.3
range = 150.0
prop_impulse = 4.0
automatic = false
kick = 0.8

[smg]                       # weapon 5: Stinger bullpup
damage = 12.0
velocity = 400
drag = 0.001
cooldown = 0.06
spread_degrees = 1.0
range = 90.0
recoil_up = 0.25
recoil_side = 0.2
heat_spread = 2.0
ads_spread = 0.5
prop_impulse = 2.0
automatic = true
kick = 0.35
mag = 40
reload = 1.8
scope_mag = 3

[dmr]                       # weapon 6: Longshot marksman rifle; crouching cuts its recoil
damage = 45.0
velocity = 900
drag = 0.0005
cooldown = 0.28
spread_degrees = 0.15
range = 300.0
recoil_up = 1.6
recoil_side = 0.3
heat_spread = 3.0
ads_spread = 0.25
prop_impulse = 5.0
automatic = false
kick = 1.6
mag = 20
reload = 2.4
scope_mag = 8

[revolver]                  # weapon 7: Warden top-break
damage = 60.0
velocity = 420
drag = 0.001
cooldown = 0.45
spread_degrees = 0.25
range = 160.0
recoil_up = 3.0
recoil_side = 0.5
heat_spread = 1.5
ads_spread = 0.5
prop_impulse = 6.0
automatic = false
kick = 2.4
mag = 6
reload = 2.2
scope_mag = 3

[grenade]                   # weapon 8: Thumper, bouncy frags on a fuse, burst on a direct hit
radius = 3.5
speed = 22.0
lift = 2.5                  # upward m/s added for a lob
gravity = 12.0
bounce = 0.45               # speed kept per bounce
fuse = 2.2
self_knockback = 8.2        # 3.4 m grenade jump, a bit weaker than rockets
cooldown = 0.6
mag = 1
reload = 1.8

[harpoon]                   # weapon 9: spear yanks you to the wall it hits, or yanks what it hits to you
speed = 70.0
gravity = 4.0
life = 1.2
pull_player = 17.0
pull_target = 14.0
cooldown = 0.4
mag = 1
reload = 1.6

[fist]                      # weapon 0: power fist, knocks things away; punch any surface to launch off it
range = 2.4
knockback = 16.0
launch = 11.0
cooldown = 0.7

[knife]                     # V: the starter knife, a quick slash with short reach
range = 2.1
knockback = 3.0
cooldown = 0.42

[player]
health = 100
regen_delay = 5.0           # seconds without damage before regen
regen_rate = 20             # hp per second
respawn_delay = 2.0
regen_cap = 0.6             # regen stops at this fraction of max; medkits heal the rest
bleed_threshold = 15        # a hit this big starts bleeding
bleed_rate = 2.0            # hp per second while bleeding
bleed_time = 8.0            # seconds, or until a medkit

[grapple]                   # ability: G / mouse 4 fires, again or jump lets go. Titanfall 2 ships 50 power to fire of 100, 50/s use, 28 m rope
range = 30.0
power_max = 100.0
power_to_fire = 10.0
power_use_rate = 10.0       # per second while pulling
power_regen = 60.0          # per second while not pulling
pull_accel = 55.0
pull_max_speed = 22.0
look_steer = 0.6            # pull direction blends from the rope toward where you look
release_boost = 2.0         # m/s added along your velocity when you jump off the rope
arrive_distance = 1.5
gravity_cancel = 0.8        # how much of gravity the taut rope carries while you are pulled

[graphics]                  # the look: sky and post effects
atmosphere = true           # physical sky and sun; off = plain blue sky, cheaper
toon = true                 # comic shading: banded light, shadow dots, ink outlines
ssao = true                 # screen-space ambient occlusion (off under toon)
taa = true                  # temporal anti-aliasing
bloom = true
exposure = 15               # camera EV100, 15 is full sun; lower = brighter
shadow_distance = 500       # m; lower if the frame rate drops

[sound]                     # volumes 0..1; drop CC0 .ogg files in assets/sounds/ (rifle, shotgun, ...) to replace the synthesized ones
master = 0.8
guns = 0.9
effects = 0.7
engine = 0.6
ambience = 0.5

[terrain]
cell = 0.5          # finest terrain cell, m; 1 on a weak machine
split = 2.5         # a chunk splits when you will be nearer than this many chunk sizes in a second; merges past 3
bubble = 400        # m, solid ground and awake physics around you
origin_step = 2000  # m, the world re-centres on you after this far
workers = 4         # chunk builds in flight

[ship_combat]       # ship guns and shields; each ship's shield, hull and muzzles are in assets/ships.toml
gun_rate = 2        # shots a second per barrel; the two barrels fire in turn
gun_speed = 1200    # m/s, on top of the ship's own velocity
gun_damage = 12     # per shot, shield and hull alike
gun_range = 2000    # m, then the shot is gone
converge = 400      # m ahead of the nose where the two barrels' shots cross
heat_per_shot = 0.08  # 1 overheats: about six seconds of fire
cool = 0.15         # heat lost a second
resume = 0.4        # an overheated gun fires again once cooled to this
air_drag = 0.1      # 1/s in sea-level air, thinning with height; none in vacuum
shield_delay = 5    # s with no hit before a shield comes back
shield_regen = 10   # shield points a second once it does
# enemy ships (each hull's way of fighting is its `ai` entry in assets/ships.toml)
enemy_cap = 8       # at most this many alive at once
spawn_near = 1500   # m from you, raiders come in between these, never ahead of the nose
spawn_far = 3000
despawn = 6000      # m, a raider further off is gone
raider = "jackal"   # what raiders fly
raid_pack = [2, 4]  # ships a pack, fewest and most
raid_delay = 90     # s between packs while you fly
raid_hurry = 120    # s without a fight that make the raid clock run twice as fast
raid_grace = 60     # s after boarding with no raiders
raid_clear = 3000   # m, no raiders this close to a base
patrols = 2         # per base whose faction flies a fighter (not the Roost)
patrol_range = 8000 # m from the base, the patrols are up while you are inside this
patrol_radius = 900 # m, the loop round the base
patrol_altitude = 300  # m over the base
patrol_engage = 2500   # m from the base, they take you on inside this
patrol_give_up = 4000  # and let you go past this
patrol_respawn = 600   # s of game time before one shot down is back
ai_floor = 150      # m an enemy pilot keeps over the ground
ai_lookahead = 4    # s it looks ahead along its sink rate
# homing missiles (right mouse while flying)
missiles = 4        # carried; one more comes back every missile_reload
missile_reload = 10 # s
lock_cone = 6       # degrees off the nose: hold a ship of another side in it to lock
lock_time = 1.2     # s it must stay there
lock_range = 3000   # m
missile_speed = 600 # m/s it gains over the launcher's speed
missile_kick = 40   # m/s it leaves the rail at, over the launcher's speed
missile_accel = 400 # m/s² until it is there
missile_turn = 1.4  # rad/s at most, so a hard turn outturns it
missile_nav = 4     # proportional navigation gain
missile_lag = 0.4   # s it answers the guidance behind: a hard, late break outturns it
missile_seeker = 60 # degrees off its nose before it loses the target
missile_life = 8    # s, then it bursts on its own
missile_fuse = 8    # m from its target it bursts
missile_damage = 80 # shield first, then hull
ai_missile_gap = 8  # s between an enemy pilot's launches
# what a fight pays and costs
bounty = { jackal = 60, sentry = 120, censer = 150, welder = 200 }  # $ into the bank per kill, by ship id
bank_loss = 0.25    # share of the bank lost when your ship is shot down, rounded down
downed = 3          # s watching the wreck before you are back at the Roost in a fresh Kestrel
loss_card = 4       # s the SHOT DOWN card stays up after that
bounty_line = 3     # s the +$ BOUNTY line stays over the HUD
# faction standing, -100 to 100, with the Regime, the Scrappers and the PMC (Pause > Standing)
standing_start = { regime = -20, scrappers = 0, pmc = -20 }  # a stranger to the Regime and the PMC (their patrols shoot on sight below 0); the Scrappers are old friends of the Deserters
standing_deserters = 50   # your own side, fixed
standing_delivery = 10    # a parcel delivered to the faction's base
standing_raider_kill = 2  # a raider shot down, with each of the three
standing_kill = -25       # one of the faction's ships shot down
standing_rival_kill = 5   # and with each faction holding a grudge against it (grudges)
standing_hit = -3         # a hit on one of its ships, once a ship a fight
standing_recovery = 1     # creeps back this much a day while below where it started, to it
standing_day = 2880       # s of game time to a day (Haven's 48 minutes)
standing_friendly = 40    # at or above: 15% off at its base, +20% for a parcel to it
standing_wary = -40       # below: 15% on at its base
standing_hunted = -60     # at or below: its base will not serve you and it sends hunters
standing_discount = 0.15
standing_markup = 0.15
standing_bonus = 0.2
hunt_pack = [2, 3]        # hunters a pack, of the faction's patrol hull, at the raiders' rate
standing_line = 3         # s the REGIME -25 line stays over the HUD
[ship_combat.grudges]     # who each faction holds a grudge against: shooting their ships down pleases it
regime = ["deserters", "scrappers"]
scrappers = ["regime", "pmc"]
pmc = []                  # the PMC sells to everyone and holds no grudge
